{% set name = "intake-cmip" %}
{% set version = "2019.1.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 8c01220a15841f6cd99795919b61bf22072598df9a7d343fd8b66399a772879d
  

build: 
  script: "{{ PYTHON }} -m pip install . --no-deps -vv"
  number: 1
  noarch: python

requirements:

  host:
    - python {{ python_min }}
    - pip

  run:
    - python >={{ python_min }}
    - xarray
    - intake-xarray
    - dask

test:
  source_files:
    - tests
  requires:
    - pytest
    - xarray
    - netcdf4
    - cftime
    - python {{ python_min }}
  imports:
    - intake_cmip
  commands:
    - pytest --verbose

about:
  
  home: https://github.com/NCAR/intake-cmip
  license: Apache 2.0
  license_file: LICENSE
  summary: |
    Intake-cmip provides a plugin for reading CMIP5, and CMIP6 data using intake. 
  dev_url: https://github.com/NCAR/intake-cmip
  doc_url: https://intake-cmip.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - andersy005
    - kmpaul
